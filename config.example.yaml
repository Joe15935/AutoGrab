# Configuration outline only. Runtime reads config/config.toml via Python tomllib.
# Use config/config.example.toml as the executable template; no YAML dependency.
mode: DRY_RUN
# Separate foreground order-smoke authority is never loaded from this outline.
REAL_ORDER_SMOKE_TEST_ARMED: false
LIVE: OFF
ARM: OFF
providers:
  bandwagon:
    enabled: true
  dmit:
    enabled: true
  vmiss:
    enabled: true
    interval_seconds: 900
  vps:
    enabled: true
  apple:
    enabled: true
    # Set an actual official region and SKU before enabling an inventory target.
    region: null
    targets: []
    interval_seconds: 60
email:
  enabled: false
  recipient: you@example.com
# No price/budget filter, account secret, cookie, or final-order setting.
